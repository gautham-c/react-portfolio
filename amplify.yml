version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd apps/nextjs-app
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: apps/nextjs-app/.next
    files:
      - '**/*'
  cache:
    paths:
      - apps/nextjs-app/node_modules/**/*
      - apps/nextjs-app/.next/cache/**/*
